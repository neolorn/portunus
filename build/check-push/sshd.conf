# The check's server: the owner's login by key alone, an Ed25519 host key made at the start,
# and room for every key the owner's agent offers before the one authorized.
HostKey /etc/ssh/ssh_host_ed25519_key
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers owner
MaxAuthTries 64
